<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>AT89LP</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="/assets/computer-chip-core.png">
</head>

<body>
    <header>
        <img src="assets/computer-chip-core.png" alt="logo">
        <span class="title">AT89LP</span>
    </header>

    <div class="features">
        <div class="feature-card">
            <img src="assets/build_menu.png" alt="build-menu">
            <div class="feature-card-description">
                <h2>Build Menu</h2>
                <div>
                    The build menu is used to build your project.
                </div>
            </div>
        </div>
        <div class="feature-card">
            <img src="assets/program_menu.png" alt="program-menu">
            <div class="feature-card-description">
                <h2>Program Menu</h2>
                <div>
                    The program menu is used to program your microcontroller.
                </div>
            </div>
        </div>
        <div class="feature-card">
            <img src="assets/serial_monitor_menu.png" alt="serial-monitor-menu">
            <div class="feature-card-description">
                <h2>Serial Monitor Menu</h2>
                <div>
                    The serial monitor is used to debug serial communication.
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js" async defer></script>
</body>

</html>
